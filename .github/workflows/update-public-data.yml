name: Update public data

on:
  schedule:
    # Cada 15 minutos, evitando los cuartos exactos.
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-public-data
  cancel-in-progress: true

jobs:
  update-public-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download public exports
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://script.google.com/macros/s/AKfycbxcmJ4_kBZKJe9Npa7lQ4kcQzRdEN_j6Xc11zq2T6ak628dgi4VYcGZv3VNVyGr8KLc/exec"

          LAYERS=(
            el-hierro
            la-gomera
            la-palma
            tenerife
            gran-canaria
            fuerteventura
            lanzarote
            la-graciosa
            canarias
          )

          rm -rf .tmp
          mkdir -p .tmp/new/tv .tmp/new/map

          fetch() {
            local url="$1"
            local output="$2"

            curl \
              --fail \
              --show-error \
              --silent \
              --location \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 60 \
              "$url" \
              --output "$output"
          }

          fetch "${BASE_URL}?export=tv" \
            .tmp/new/tv/feed.json

          fetch "${BASE_URL}?export=manifest" \
            .tmp/new/manifest.json

          for layer in "${LAYERS[@]}"; do
            fetch \
              "${BASE_URL}?export=umap&layer=${layer}" \
              ".tmp/new/map/${layer}.geojson"
          done

      - name: Validate exports
        shell: bash
        run: |
          set -euo pipefail

          # Todos los archivos deben existir, contener datos
          # y ser JSON válido.
          while IFS= read -r -d '' file; do
            if [ ! -s "$file" ]; then
              echo "ERROR: empty export: $file"
              exit 1
            fi

            jq empty "$file"
          done < <(find .tmp/new -type f -print0)

          # TV: debe tener versión de esquema.
          jq -e '
            type == "object"
            and (.schema_version != null)
          ' .tmp/new/tv/feed.json >/dev/null

          # Manifest: comprobación mínima de contrato.
          jq -e '
            type == "object"
            and (.name != null)
            and (.umap != null)
            and (.tv != null)
          ' .tmp/new/manifest.json >/dev/null

          # Cada capa debe ser GeoJSON FeatureCollection.
          for file in .tmp/new/map/*.geojson; do
            jq -e '
              .type == "FeatureCollection"
              and (.features | type == "array")
            ' "$file" >/dev/null
          done

      - name: Compare meaningful content
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            .tmp/normalized-new \
            .tmp/normalized-old

          # Ignoramos fechas generadas automáticamente.
          # walk() lo hace también dentro de objetos anidados,
          # por ejemplo archipielago_vivo.generated_at.
          normalize() {
            jq -S '
              walk(
                if type == "object" then
                  del(
                    .generated_at,
                    .generatedAt,
                    .updated_at,
                    .updatedAt,
                    .timestamp
                  )
                else
                  .
                end
              )
            ' "$1"
          }

          changed=false

          while IFS= read -r -d '' new_file; do

            rel="${new_file#.tmp/new/}"
            current="$rel"

            normalized_new=".tmp/normalized-new/${rel}"
            normalized_old=".tmp/normalized-old/${rel}"

            mkdir -p \
              "$(dirname "$normalized_new")" \
              "$(dirname "$normalized_old")"

            normalize "$new_file" > "$normalized_new"

            if [ ! -f "$current" ]; then
              echo "NEW: $rel"
              changed=true
              continue
            fi

            normalize "$current" > "$normalized_old"

            if ! cmp -s \
              "$normalized_new" \
              "$normalized_old"; then

              echo "CHANGED: $rel"
              changed=true
            fi

          done < <(
            find .tmp/new -type f -print0 | sort -z
          )

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          if [ "$changed" = "false" ]; then
            echo "No meaningful public data changes detected."
          fi

      - name: Publish snapshot
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tv map

          # Publicamos los originales.
          # La normalización anterior era sólo para comparar.
          jq . .tmp/new/tv/feed.json > tv/feed.json
          jq . .tmp/new/manifest.json > manifest.json

          for file in .tmp/new/map/*.geojson; do
            name="$(basename "$file")"
            jq . "$file" > "map/$name"
          done

      - name: Commit and push
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "Archipiélago Vivo Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            manifest.json \
            tv/feed.json \
            map/*.geojson

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "data: update public feeds"
          git push
