name: Update public data

on:
  schedule:
    # Comprobación horaria. La parrilla móvil de 7 días se recompila aunque
    # el feed no cambie, por lo que el horizonte avanza automáticamente.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-public-data
  cancel-in-progress: true

jobs:
  update-public-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download public exports
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://script.google.com/macros/s/AKfycbxcmJ4_kBZKJe9Npa7lQ4kcQzRdEN_j6Xc11zq2T6ak628dgi4VYcGZv3VNVyGr8KLc/exec"

          LAYERS=(
            el-hierro
            la-gomera
            la-palma
            tenerife
            gran-canaria
            fuerteventura
            lanzarote
            la-graciosa
            canarias
          )

          rm -rf .tmp
          mkdir -p .tmp/new/tv .tmp/new/map

          fetch() {
            local url="$1"
            local output="$2"
            curl \
              --fail \
              --show-error \
              --silent \
              --location \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 60 \
              "$url" \
              --output "$output"
          }

          fetch "${BASE_URL}?export=tv" .tmp/new/tv/feed.json
          fetch "${BASE_URL}?export=manifest" .tmp/new/manifest.json

          for layer in "${LAYERS[@]}"; do
            fetch "${BASE_URL}?export=umap&layer=${layer}" ".tmp/new/map/${layer}.geojson"
          done

      - name: Validate source exports
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            if [ ! -s "$file" ]; then
              echo "ERROR: empty export: $file"
              exit 1
            fi
            jq empty "$file"
          done < <(find .tmp/new -type f -print0)

          jq -e 'type == "object" and (.schema_version != null)' .tmp/new/tv/feed.json >/dev/null
          jq -e 'type == "object" and (.name != null) and (.umap != null) and (.tv != null)' .tmp/new/manifest.json >/dev/null

          for file in .tmp/new/map/*.geojson; do
            jq -e '.type == "FeatureCollection" and (.features | type == "array")' "$file" >/dev/null
          done

      - name: Compile TV schedule and editorial statistics
        shell: bash
        env:
          TV_SCHEDULE_DAYS: "7"
          TV_TARGET_COVERAGE_DAYS: "7"
        run: |
          set -euo pipefail
          node scripts/compile-tv.js \
            --input .tmp/new/tv/feed.json \
            --out .tmp/new/tv

      - name: Validate compiled TV data
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            .schema_version == 1
            and (.schedule_version | type == "string")
            and (.channels | type == "array")
            and (.global | type == "array")
            and (.timelines | type == "object")
            and (.program_boundaries | type == "object")
          ' .tmp/new/tv/schedule.json >/dev/null

          jq -e '
            .schema_version == 1
            and (.summary.unique_videos | type == "number")
            and (.programs | type == "array")
          ' .tmp/new/tv/catalog-stats.json >/dev/null

          jq -e '
            .schema_version == 1
            and (.schedule_version | type == "string")
            and (.schedule_url | type == "string")
            and (.catalog_stats_url | type == "string")
          ' .tmp/new/tv/manifest.json >/dev/null

      - name: Compare meaningful content
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .tmp/normalized-new .tmp/normalized-old

          normalize() {
            jq -S '
              walk(
                if type == "object" then
                  del(
                    .generated_at,
                    .generatedAt,
                    .updated_at,
                    .updatedAt,
                    .timestamp,
                    .schedule_generated_at
                  )
                else
                  .
                end
              )
            ' "$1"
          }

          changed=false

          while IFS= read -r -d '' new_file; do
            rel="${new_file#.tmp/new/}"
            current="$rel"
            normalized_new=".tmp/normalized-new/${rel}"
            normalized_old=".tmp/normalized-old/${rel}"

            mkdir -p "$(dirname "$normalized_new")" "$(dirname "$normalized_old")"
            normalize "$new_file" > "$normalized_new"

            if [ ! -f "$current" ]; then
              echo "NEW: $rel"
              changed=true
              continue
            fi

            normalize "$current" > "$normalized_old"
            if ! cmp -s "$normalized_new" "$normalized_old"; then
              echo "CHANGED: $rel"
              changed=true
            fi
          done < <(find .tmp/new -type f -print0 | sort -z)

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Publish snapshot
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tv map

          jq . .tmp/new/tv/feed.json > tv/feed.json
          jq . .tmp/new/tv/schedule.json > tv/schedule.json
          jq . .tmp/new/tv/catalog-stats.json > tv/catalog-stats.json
          jq . .tmp/new/tv/manifest.json > tv/manifest.json
          jq . .tmp/new/manifest.json > manifest.json

          for file in .tmp/new/map/*.geojson; do
            name="$(basename "$file")"
            jq . "$file" > "map/$name"
          done

      - name: Commit and push
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Archipiélago Vivo Data Bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            manifest.json \
            tv/feed.json \
            tv/schedule.json \
            tv/catalog-stats.json \
            tv/manifest.json \
            map/*.geojson

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "data: compile TV schedule and catalog stats"
          git push
